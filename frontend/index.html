<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson Booking Login</title>
    <style>
      :root {
        --bg: #f8f4ea;
        --bg-soft: #eef5ff;
        --line: #d4deea;
        --text: #10243a;
        --muted: #5d7086;
        --brand: #1363df;
        --danger: #c93f3f;
        --panel: #fff;
        --shadow: 0 18px 44px rgba(16, 36, 58, 0.11);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: "IBM Plex Sans KR", "Pretendard", "Apple SD Gothic Neo", sans-serif;
        background:
          radial-gradient(circle at 10% -10%, #d6e8ff 0%, rgba(214, 232, 255, 0) 35%),
          radial-gradient(circle at 100% 0, #ffe2be 0%, rgba(255, 226, 190, 0) 30%),
          linear-gradient(165deg, var(--bg) 0%, var(--bg-soft) 56%, #f5f9ff 100%);
      }
      .wrap {
        width: min(980px, 94vw);
        margin: 24px auto 40px;
        display: grid;
        gap: 14px;
      }
      .topbar {
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px 18px;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(6px);
        box-shadow: var(--shadow);
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }
      .brand { display: grid; gap: 4px; }
      .brand strong { font-size: 18px; letter-spacing: -0.02em; }
      .brand small { color: var(--muted); }
      .top-links { display: inline-flex; gap: 8px; flex-wrap: wrap; }
      .top-links a {
        text-decoration: none;
        color: #173a64;
        background: #edf3ff;
        border: 1px solid #cfddf4;
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 13px;
        font-weight: 600;
      }
      .panel {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        box-shadow: var(--shadow);
        padding: 16px;
      }
      .panel h1 { margin: 0 0 8px; font-size: 28px; }
      .panel p { margin: 0; color: var(--muted); }
      .grid { display: grid; gap: 12px; }
      .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .subpanel {
        border: 1px solid #dbe5f2;
        border-radius: 14px;
        background: #fdfefe;
        padding: 12px;
        display: grid;
        gap: 10px;
      }
      h2, h3 { margin: 0; }
      label { display: grid; gap: 5px; color: var(--muted); font-size: 13px; }
      input, select, textarea, button { font: inherit; }
      input, select {
        width: 100%;
        border: 1px solid #cfdceb;
        border-radius: 10px;
        padding: 9px 10px;
        background: #fff;
        color: var(--text);
      }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      button {
        border: 1px solid #cdd8e6;
        border-radius: 10px;
        background: #eff4fb;
        color: #21405f;
        padding: 8px 12px;
        min-height: 38px;
        cursor: pointer;
        font-weight: 600;
      }
      button.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
      button.danger { background: #fdeaea; border-color: #f3c7c7; color: var(--danger); }
      .status {
        border: 1px solid #cad9ec;
        border-radius: 10px;
        background: #f5f9ff;
        padding: 10px;
        font-size: 13px;
      }
      .hint { color: var(--muted); font-size: 12px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      #log {
        margin: 0;
        min-height: 140px;
        max-height: 320px;
        overflow: auto;
        border-radius: 10px;
        padding: 10px;
        background: #0f1a2a;
        color: #d6e4f8;
        font-size: 12px;
      }
      @media (max-width: 760px) { .grid.two { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main class="wrap">
      <nav class="topbar">
        <div class="brand">
          <strong>Lesson Booking Workspace</strong>
          <small>역할별 페이지 분리: 로그인 / 학생 / 선생님</small>
        </div>
        <div class="top-links">
          <a href="/index.html">로그인</a>
          <a href="/student.html">학생</a>
          <a href="/teacher.html">선생님</a>
          <a href="/guide.html">사용자 설명서</a>
        </div>
      </nav>

      <section class="panel">
        <h1>로그인</h1>
        <p>로그인 후 역할에 맞는 페이지로 자동 이동합니다.</p>
      </section>

      <section class="panel grid two">
        <article class="subpanel">
          <h3>로그인</h3>
          <form id="loginForm" class="grid">
            <div class="grid two">
              <label>아이디 <input name="login_id" value="teacher@example.com" required /></label>
              <label>비밀번호 <input name="password" type="password" value="password123!" required /></label>
            </div>
            <div class="actions">
              <button class="primary" type="submit">로그인</button>
              <button id="teacherPreset" type="button">교사 프리셋</button>
              <button id="studentPreset" type="button">학생 프리셋</button>
              <button id="healthBtn" type="button">헬스체크</button>
            </div>
          </form>
        </article>

        <article class="subpanel">
          <h3>회원가입</h3>
          <form id="registerForm" class="grid">
            <div class="grid two">
              <label>아이디 <input name="login_id" placeholder="teacher01" required /></label>
              <label>휴대폰번호 <input name="phone" placeholder="01012345678" required /></label>
            </div>
            <div class="grid two">
              <label>이름 <input name="name" placeholder="테스터" required /></label>
              <label>역할
                <select name="role">
                  <option value="STUDENT">STUDENT</option>
                  <option value="TEACHER">TEACHER</option>
                </select>
              </label>
            </div>
            <label>비밀번호 <input name="password" type="password" minlength="8" required /></label>
            <div class="actions">
              <button type="submit">회원가입</button>
              <button id="logoutBtn" class="danger" type="button">로그아웃</button>
            </div>
          </form>
        </article>
      </section>

      <section class="panel grid">
        <div class="status" id="authStatus">로그인되지 않았습니다.</div>
        <label>토큰 <input id="tokenBox" class="mono" readonly /></label>
        <p class="hint">학생 계정: student@example.com / password123! | 선생님 계정: teacher@example.com / password123!</p>
        <pre id="log"></pre>
      </section>
    </main>

    <script>
      const state = {
        token: localStorage.getItem('lb_token') || '',
        user: null,
      };

      const authStatus = document.getElementById('authStatus');
      const tokenBox = document.getElementById('tokenBox');
      const logEl = document.getElementById('log');
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');

      function pushLog(title, payload) {
        const line = `[${new Date().toLocaleTimeString('ko-KR', { hour12: false })}] ${title}\n${JSON.stringify(payload, null, 2)}\n\n`;
        logEl.textContent = line + logEl.textContent;
      }

      function getErrorMessage(err) {
        if (err?.payload?.error) return String(err.payload.error);
        if (err?.message) return String(err.message);
        return String(err);
      }

      async function runAction(label, fn) {
        try {
          await fn();
        } catch (err) {
          const message = getErrorMessage(err);
          pushLog(`${label} FAILED`, { message, payload: err?.payload });
          window.alert(`${label} 실패: ${message}`);
        }
      }

      function formObject(form) {
        return Object.fromEntries(new FormData(form).entries());
      }

      function renderAuth() {
        tokenBox.value = state.token || '';
        if (state.user) {
          authStatus.textContent = `로그인: ${state.user.email} (${state.user.role})`;
        } else if (state.token) {
          authStatus.textContent = '토큰은 있으나 사용자 정보는 미확인 상태입니다.';
        } else {
          authStatus.textContent = '로그인되지 않았습니다.';
        }
      }

      function setAuth(token, user) {
        state.token = token || '';
        state.user = user || null;
        if (state.token) {
          localStorage.setItem('lb_token', state.token);
        } else {
          localStorage.removeItem('lb_token');
        }
        renderAuth();
      }

      async function api(path, options = {}) {
        const { method = 'GET', body, auth = false } = options;
        const headers = {};
        if (body !== undefined) headers['Content-Type'] = 'application/json';
        if (auth) {
          if (!state.token) throw new Error('로그인 토큰이 없습니다.');
          headers.Authorization = `Bearer ${state.token}`;
        }

        const res = await fetch(path, {
          method,
          headers,
          body: body !== undefined ? JSON.stringify(body) : undefined,
        });

        const raw = await res.text();
        let payload = { raw };
        if (raw) {
          try { payload = JSON.parse(raw); } catch (_) { payload = { raw }; }
        }

        pushLog(`${method} ${path} -> ${res.status}`, payload);
        if (!res.ok) {
          const err = new Error(`${method} ${path} failed (${res.status})`);
          err.payload = payload;
          throw err;
        }
        return payload;
      }

      async function syncMe() {
        if (!state.token) {
          setAuth('', null);
          return;
        }
        const result = await api('/api/v1/auth/me', { auth: true });
        state.user = result.user;
        renderAuth();
      }

      function redirectByRole(role) {
        if (role === 'STUDENT') {
          window.location.href = '/student.html';
          return;
        }
        if (role === 'TEACHER') {
          window.location.href = '/teacher.html';
          return;
        }
        window.location.href = '/index.html';
      }

      document.getElementById('teacherPreset').addEventListener('click', () => {
        loginForm.elements.login_id.value = 'teacher@example.com';
        loginForm.elements.password.value = 'password123!';
      });

      document.getElementById('studentPreset').addEventListener('click', () => {
        loginForm.elements.login_id.value = 'student@example.com';
        loginForm.elements.password.value = 'password123!';
      });

      document.getElementById('healthBtn').addEventListener('click', () => {
        runAction('헬스체크', async () => {
          await api('/api/health');
        });
      });

      document.getElementById('logoutBtn').addEventListener('click', () => {
        runAction('로그아웃', async () => {
          if (state.token) {
            await api('/api/v1/auth/logout', { method: 'POST', auth: true });
          }
          setAuth('', null);
        });
      });

      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        runAction('로그인', async () => {
          const form = formObject(loginForm);
          const result = await api('/api/v1/auth/login', {
            method: 'POST',
            body: { login_id: form.login_id, password: form.password },
          });
          setAuth(result.token, result.user);
          redirectByRole(result.user?.role);
        });
      });

      registerForm.addEventListener('submit', (e) => {
        e.preventDefault();
        runAction('회원가입', async () => {
          const form = formObject(registerForm);
          const result = await api('/api/v1/auth/register', {
            method: 'POST',
            body: {
              login_id: form.login_id,
              phone: form.phone,
              password: form.password,
              name: form.name,
              role: form.role,
            },
          });
          setAuth(result.token, result.user);
          redirectByRole(result.user?.role);
        });
      });

      async function bootstrap() {
        renderAuth();
        if (!state.token) return;
        await runAction('세션 복원', async () => {
          await syncMe();
          if (state.user?.role) {
            redirectByRole(state.user.role);
          }
        });
      }

      bootstrap();
    </script>
  </body>
</html>
