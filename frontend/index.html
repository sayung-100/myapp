<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson Booking MVP</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7fb;
        color: #111;
      }
      main {
        max-width: 760px;
        margin: 40px auto;
        padding: 0 16px;
      }
      .card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 20px;
      }
      code {
        background: #f3f4f6;
        padding: 2px 6px;
        border-radius: 6px;
      }
      button {
        margin-top: 12px;
        border: 0;
        background: #111827;
        color: #fff;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
      }
      #result {
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Lesson Booking MVP</h1>
      <div class="card">
        <p>Frontend is running. Backend health is available through proxy: <code>/api/health</code>.</p>
        <button id="check">Check /api/health</button>
        <pre id="result"></pre>
      </div>
    </main>

    <script>
      const btn = document.getElementById('check');
      const result = document.getElementById('result');

      btn.addEventListener('click', async () => {
        result.textContent = 'Loading...';
        try {
          const res = await fetch('/api/health');
          const data = await res.json();
          result.textContent = JSON.stringify(data, null, 2);
        } catch (err) {
          result.textContent = String(err);
        }
      });
    </script>
  </body>
</html>
